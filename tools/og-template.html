<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: 1200px 630px; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #0b0f14; color: #e6edf3; position: relative;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(#17202a 1px, transparent 1px),
      linear-gradient(90deg, #17202a 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(75% 70% at 25% 30%, #000, transparent 78%);
  }
  .glow {
    position: absolute; inset: -30% -10% auto -20%; height: 150%;
    background:
      radial-gradient(52% 46% at 20% 22%, rgba(77,212,172,.20), transparent 68%),
      radial-gradient(46% 42% at 86% 8%, rgba(127,209,255,.13), transparent 72%);
  }
  .in { position: relative; padding: 72px 76px; height: 100%; display: flex; flex-direction: column; }
  .eyebrow {
    font-family: ui-monospace, Menlo, monospace; font-size: 17px;
    letter-spacing: .22em; text-transform: uppercase; color: #6b7f92;
  }
  h1 { font-size: 82px; font-weight: 700; letter-spacing: -.03em; margin-top: 20px; }
  .role {
    font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic;
    font-size: 33px; color: #4dd4ac; margin-top: 12px; letter-spacing: -.01em;
  }
  .line { flex: 1; }
  .stats { display: flex; gap: 56px; align-items: flex-end; }
  .s b {
    display: block; font-family: ui-monospace, Menlo, monospace;
    font-size: 40px; font-weight: 700; color: #4dd4ac; letter-spacing: -.03em;
  }
  .s span { display: block; font-size: 17px; color: #6b7f92; margin-top: 6px; }
  .url {
    margin-left: auto; font-family: ui-monospace, Menlo, monospace;
    font-size: 20px; color: #9fb0c0;
  }
  svg.sig { position: absolute; left: 0; right: 0; bottom: 176px; width: 1200px; height: 150px; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <svg class="sig" viewBox="0 0 1200 150" preserveAspectRatio="none">
    <defs>
      <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4dd4ac" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#4dd4ac" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="m" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
        <stop offset="14%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="86%" stop-color="#fff" stop-opacity="1"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="mk"><rect width="1200" height="150" fill="url(#m)"/></mask>
    </defs>
    <g mask="url(#mk)">
      <path d="M0 96 C 70 96 90 56 150 56 S 230 116 300 116 S 372 38 440 38
               S 520 106 590 106 S 660 66 730 66 S 806 120 875 120 S 950 28 1020 28
               S 1120 88 1200 78 L1200 150 L0 150 Z" fill="url(#f)"/>
      <path d="M0 96 C 70 96 90 56 150 56 S 230 116 300 116 S 372 38 440 38
               S 520 106 590 106 S 660 66 730 66 S 806 120 875 120 S 950 28 1020 28
               S 1120 88 1200 78"
            fill="none" stroke="#4dd4ac" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </svg>

  <div class="in">
    <div class="eyebrow">Ho Chi Minh City · Open to remote</div>
    <h1>Lê Minh Đăng</h1>
    <div class="role">Data &amp; Business Analyst — SQL, Python, and the tests that keep a number honest</div>
    <div class="line"></div>
    <div class="stats">
      <div class="s"><b>5</b><span>public projects</span></div>
      <div class="s"><b>96.9%</b><span>Recall@1, unseen SKUs</span></div>
      <div class="s"><b>3</b><span>negative results published</span></div>
      <div class="url">conchocon154.github.io</div>
    </div>
  </div>
</body>
</html>
